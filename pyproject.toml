[project]
name = "realtime-fraud-detection-platform"
version = "0.1.0"
description = "Platform penilaian risiko fraud real-time untuk transaksi kartu card-not-present"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.1",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "mlflow==3.16.1",
    "onnx>=1.23.0",
    "onnxconverter-common>=1.16.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.30.0",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skl2onnx>=1.20.0",
    "uvicorn>=0.53.0",
    "xgboost>=3.4.1",
]

# PyTorch hanya untuk pelatihan dan ekspor tier 2; image serving dipasang tanpa grup ini.
[dependency-groups]
train = [
    "torch>=2.14.1",
    "onnxscript>=0.7.2",
    "seaborn>=0.13.2",
]
# Kernel untuk notebook lokal; tanpa grup ini setiap `uv sync` menghapusnya.
notebook = [
    "ipykernel>=7.4.0",
]

[tool.uv]
# `uv sync` menghapus paket di luar grup yang diminta, jadi tanpa ini setiap sync membuang torch.
default-groups = ["train", "notebook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]
