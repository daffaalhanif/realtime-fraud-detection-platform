[project]
name = "realtime-fraud-detection-platform"
version = "0.1.0"
description = "Platform penilaian risiko fraud real-time untuk transaksi kartu card-not-present"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "mlflow==3.16.1",
    "onnx>=1.23.0",
    "onnxconverter-common>=1.16.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.30.0",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]
