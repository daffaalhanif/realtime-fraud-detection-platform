[project]
name = "realtime-fraud-detection-platform"
version = "0.1.0"
description = "Platform penilaian risiko fraud real-time untuk transaksi kartu card-not-present"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]
